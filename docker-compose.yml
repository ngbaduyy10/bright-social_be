version: '3.8'

services:
  postgres-test:
    image: postgres:15-alpine
    container_name: bright-social-test-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: bright_social_test
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - '5433:5432'
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U test_user -d bright_social_test']
      interval: 10s
      timeout: 5s
      retries: 5

  redis-test:
    image: redis:7-alpine
    container_name: bright-social-test-redis
    restart: unless-stopped
    ports:
      - '6380:6379'
    command: redis-server --requirepass test_redis_password
    healthcheck:
      test: ['CMD', 'redis-cli', '--raw', 'incr', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  postgres_test_data:
