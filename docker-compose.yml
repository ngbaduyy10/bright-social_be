version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: bright-social-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: bright_social
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: bright-social-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data: